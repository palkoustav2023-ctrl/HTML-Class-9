<!--HTML Program to show three text emphasizing tag(big, small and strike) in the webpage-->
<html>
    <head><title>Text Emphasize</title></head>
    <body>
        <u>Text emphasize example</u>:-<br>
        BIG:<br>
        <big>I like fruit</big><br>
        SMALL:<br>
        <small>Do you like most?</small><br>
        YES<br>
        <strike>NO</strike>
    </body>
</html>
